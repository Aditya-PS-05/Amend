# Multi-workspace (OAuth, public distribution) variant of docs/slack-manifest.yaml.
# Replace the redirect URL with your public HTTPS URL (e.g. a tunnel to SLACK_INSTALL_PORT).
# It must match SLACK_REDIRECT_URI exactly. See docs/SETUP.md > "Multi-workspace install".
display_information:
  name: Amend
  description: Keeps HubSpot and Gmail correct when Slack instructions change.
  background_color: "#1f2937"
features:
  bot_user:
    display_name: Amend
    always_online: true
oauth_config:
  redirect_urls:
    - https://YOUR-TUNNEL-HOST.example.com/slack/oauth_redirect
  scopes:
    bot:
      - channels:history
      - groups:history
      - channels:read
      - groups:read
      - chat:write
      - files:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - app_uninstalled
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
